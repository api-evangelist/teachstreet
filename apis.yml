name: TeachStreet
description: >-
  TeachStreet was an online learning marketplace that, in its own words,
  "helps people find great classes, courses, teachers, and instructors who help
  them learn new things," while "teachers use TeachStreet to find more students"
  (teachstreet.com homepage, archived June 2011). Surfaced in the API Evangelist
  network as a 500 Global portfolio company, TeachStreet was acquired by Amazon
  on February 2, 2012 and subsequently wound down. The teachstreet.com domain is
  now a dormant, Amazon-controlled brand-protection asset — MarkMonitor
  nameservers, a locked-down mail posture (SPF "v=spf1 -all", DMARC "p=reject"
  reporting to dmarc.amazon.com), and no A/AAAA/MX records — so there is no live
  website, developer portal, or API surface to enrich. This record is retained
  as a historical, defunct-company profile.
